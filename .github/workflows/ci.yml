name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  lint-and-typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
      - run: npm ci
      - run: npx prisma generate
        env:
          DATABASE_URL: postgresql://dummy:***@localhost:5432/dummy
      - run: npx tsc --noEmit
      - run: npx eslint .
      - run: npx prettier --check .

  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: vguide_test
          POSTGRES_USER: vguide
          POSTGRES_PASSWORD: vguide_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
      - run: npm ci
      - run: psql -h localhost -U vguide -d vguide_test -c 'CREATE EXTENSION IF NOT EXISTS citext'
        env:
          PGPASSWORD: vguide_test
      - run: npx prisma generate
        env:
          DATABASE_URL: postgresql://vguide:vguide_test@localhost:5432/vguide_test
      - run: npx prisma db push
        env:
          DATABASE_URL: postgresql://vguide:vguide_test@localhost:5432/vguide_test
      - name: Run tests (if any exist)
        run: |
          if ls __tests__/ test/ src/**/__tests__/ src/**/*.test.* src/**/*.spec.* 2>/dev/null | grep -q .; then
            npx vitest run --coverage
          else
            echo "No test files found — skipping vitest"
          fi
        env:
          DATABASE_URL: postgresql://vguide:vguide_test@localhost:5432/vguide_test

  deploy-preview:
    if: github.event_name == 'pull_request'
    needs: [lint-and-typecheck]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm i -g vercel@latest
      - name: Deploy to Vercel (Preview)
        run: vercel deploy --token=${{ secrets.VERCEL_TOKEN }} 2>&1

  deploy-production:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [lint-and-typecheck]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm i -g vercel@latest
      - name: Deploy to Vercel (Production)
        run: vercel deploy --prod --token=${{ secrets.VERCEL_TOKEN }} 2>&1
